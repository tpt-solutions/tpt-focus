[package]
name = "tpt-focus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core engine for tpt-focus: notification model, rule pipeline, focus profiles and storage."
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "UI_Notifications_Management",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Data_Xml_Dom",
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pin: 5.14+ needs rustc 1.87, this workspace is pinned to 1.85.
zbus = { version = "5.13", default-features = false, features = ["async-io"] }
x11rb = "0.13"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
tempfile = "3"
